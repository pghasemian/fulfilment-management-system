name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, test and check coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quarkus_test
          POSTGRES_PASSWORD: quarkus_test
          POSTGRES_DB: quarkus_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U quarkus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build, run unit and integration tests, enforce the coverage gate
        working-directory: java-assignment
        run: ./mvnw -B verify -DskipITs=false

      - name: Publish the JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: java-assignment/target/jacoco-report

      - name: Publish the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            java-assignment/target/surefire-reports
            java-assignment/target/failsafe-reports

  container-image:
    name: Build the JVM container image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Package the application
        working-directory: java-assignment
        run: ./mvnw -B package -DskipTests

      - name: Build the image
        working-directory: java-assignment
        run: docker build -f src/main/docker/Dockerfile.jvm -t fulfilment-monolith:${{ github.sha }} .
