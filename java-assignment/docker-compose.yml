# Local PostgreSQL used by the production profile and by the `*IT` integration tests.
# Start it with: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: fulfilment-postgres
    environment:
      POSTGRES_USER: quarkus_test
      POSTGRES_PASSWORD: quarkus_test
      POSTGRES_DB: quarkus_test
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quarkus_test"]
      interval: 5s
      timeout: 5s
      retries: 10
